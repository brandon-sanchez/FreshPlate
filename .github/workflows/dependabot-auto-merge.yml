name: Dependabot auto-merge

# Patch and minor dependency updates merge on their own once the required CI
# checks pass. Major updates are left open for a person to review, because
# they can carry breaking changes. Branch protection on main is what holds the
# merge until CI is green; this workflow only turns auto-merge on.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Read the update's metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # For a grouped PR, update-type is the largest bump in the group, so a
      # group with any major bump is skipped too. An unknown or empty type is
      # also skipped and waits for review.
      - name: Turn on auto-merge for patch and minor updates
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
