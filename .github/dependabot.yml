version: 2

# Each ecosystem gets at most two weekly PRs: one for minor and patch updates,
# and one for major updates. Keeping majors apart means a breaking bump never
# blocks the safe ones, and bundling them keeps the PR count low.
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
      python-major:
        patterns: ["*"]
        update-types: [major]

  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    # These packages must match the Expo SDK, so SDK upgrades are done by hand
    # with `npx expo install --fix`. Dependabot only offers their patch releases.
    ignore:
      # React must exactly match the renderer bundled in react-native, so even
      # its patch releases wait for the next Expo SDK upgrade.
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-test-renderer
      # Each major release targets a newer React than the Expo SDK ships.
      - dependency-name: "@testing-library/react-native"
        update-types: ["version-update:semver-major"]
      - dependency-name: expo
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@expo-google-fonts/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "*-expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@react-native-*/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@react-navigation/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: jest
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@types/jest"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
      npm-major:
        patterns: ["*"]
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
      actions-major:
        patterns: ["*"]
        update-types: [major]
