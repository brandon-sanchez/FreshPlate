name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloud Run
    # workflow_run also fires for pull requests from forks whose branch is named
    # main, so require a successful push to this repository's main.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    concurrency:
      group: freshplate-production-deploy
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Check deployment variables
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          GCP_CLOUD_RUN_SERVICE_ACCOUNT: ${{ vars.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}
          GCP_CLOUD_BUILD_SERVICE_ACCOUNT: ${{ vars.GCP_CLOUD_BUILD_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          missing=()
          for name in GCP_PROJECT_ID GCP_REGION GCP_WORKLOAD_IDENTITY_PROVIDER GCP_DEPLOY_SERVICE_ACCOUNT GCP_CLOUD_RUN_SERVICE_ACCOUNT GCP_CLOUD_BUILD_SERVICE_ACCOUNT; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing production environment variables: ${missing[*]}. See docs/deployment.md."
            exit 1
          fi
      - name: Skip superseded main push
        id: freshness
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          latest_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$latest_sha" != "$TESTED_SHA" ]; then
            echo "This push is superseded by $latest_sha; skipping deployment."
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate to Google Cloud
        if: steps.freshness.outputs.current == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Set up Google Cloud CLI
        if: steps.freshness.outputs.current == 'true'
        uses: google-github-actions/setup-gcloud@v3
      - name: Deploy the API
        id: deploy
        if: steps.freshness.outputs.current == 'true'
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: freshplate-api
          region: ${{ vars.GCP_REGION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          source: backend
          flags: >-
            --service-account=${{ vars.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}
            --build-service-account=projects/${{ vars.GCP_PROJECT_ID }}/serviceAccounts/${{ vars.GCP_CLOUD_BUILD_SERVICE_ACCOUNT }}
            --port=8080
            --memory=512Mi
            --min-instances=0
            --max-instances=2
            --set-env-vars=LANGSMITH_TRACING=true,LANGSMITH_PROJECT=freshplate
            --set-secrets=GEMINI_API_KEY=gemini-api-key:latest,SUPABASE_URL=supabase-url:latest,SUPABASE_PUBLISHABLE_KEY=supabase-publishable-key:latest,SUPABASE_SECRET_KEY=supabase-secret-key:latest,LANGSMITH_API_KEY=langsmith-api-key:latest
      - name: Smoke test the deployed API
        if: steps.freshness.outputs.current == 'true'
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if body="$(curl --fail --silent --show-error --max-time 30 "$SERVICE_URL/health")" && grep -q '"service": *"freshplate-api"' <<<"$body"; then
              echo "$body"
              exit 0
            fi
            echo "Smoke test attempt $attempt failed; retrying."
            sleep 10
          done
          echo "::error::$SERVICE_URL/health did not return the freshplate-api health response."
          exit 1
