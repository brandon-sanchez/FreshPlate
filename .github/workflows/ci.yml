name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels that PR's older run. Each push to main gets its
# own group (the run ID), so a run on main is never cancelled and every commit
# on main gets a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt ruff==0.16.1
      - name: Run Ruff
        run: ruff check .
      - name: Run pytest
        run: pytest

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Run TypeScript
        run: npx tsc --noEmit
      - name: Run Jest
        run: npm test -- --runInBand

  docker:
    name: Docker build
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build the backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          platforms: linux/arm64
          push: false
          load: true
          provenance: false
          tags: freshplate-api
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check /health
        run: |
          docker run --detach --publish 8080:8080 --name api freshplate-api
          for _ in $(seq 1 30); do
            if curl --silent --fail http://localhost:8080/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs api
          exit 1
